# Deck metadata and slide order. Format: references/slide-schema.md
# Only a restricted YAML subset is supported (no trailing comments on a
# value line). Validate with:
#   python3 "$UW_SLIDES_HOME/tools/deckparse.py" deck deck.yml
title: "Helping Researchers Onboard to the Commercial Cloud"
audience: "Rice University research IT professionals who know traditional HPC workflows but are new to AWS and other commercial clouds"
# Total talk length in minutes (integer).
duration: 90
# presenter: "Name"
# Quote dates: date: "2026-01-31"
# Catalog version pin, if the deck uses catalog slides: catalog: v1.0.0

objectives:
  obj-1: "Explain what the commercial cloud adds to research and teaching, and how CloudBank removes the access and billing barriers"
  obj-2: "Guide a researcher through the decision path, from whether the cloud fits to a CloudBank allocation, onboarding and a planned exit"
  obj-3: "Use generative AI to deploy cloud solutions, and design projects around storage, compute and network at the right level of abstraction"
  obj-4: "Anticipate common cloud pitfalls and steer researchers toward guardrails and open, shared resources"

